services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gametable}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gametable}
      POSTGRES_DB: ${POSTGRES_DB:-gametable}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gametable}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gametable}:${POSTGRES_PASSWORD:-gametable}@db:5432/${POSTGRES_DB:-gametable}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      MEDIA_DIR: /media
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-open}
    volumes:
      - media-data:/media
      - ./backend:/app
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  media-data:
